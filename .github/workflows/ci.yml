name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.cursorrules'
      - 'RELEASE_NOTES.md'
      - 'RELEASE_WORKFLOW.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.cursorrules'
      - 'RELEASE_NOTES.md'
      - 'RELEASE_WORKFLOW.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Check flake
      run: |
        nix flake check
        nix flake show --all-systems --json >/dev/null

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Build Nix package
      run: nix build

    # The stdio server exits 0 once stdin closes; a startup crash fails and a hang hits the timeout (exit 124).
    - name: Test package runs
      run: timeout 10s ./result/bin/mcp-nixos < /dev/null

    - name: Build Python distribution
      run: |
        nix develop --command python -m build --no-isolation
        ls -la dist/

    - name: Validate package metadata
      run: nix develop --command twine check dist/*

  lint:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Lint with ruff
      run: |
        nix develop --command ruff check mcp_nixos/ tests/
        nix develop --command ruff format --check mcp_nixos/ tests/

    - name: Type check with mypy
      run: nix develop --command mypy mcp_nixos/

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Run tests
      timeout-minutes: 10
      run: |
        nix develop --command pytest tests/ -v -n auto --cov=mcp_nixos --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: utensils/mcp-nixos
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # The Nix test job uses the pinned interpreter and FastMCP. This job tests what
  # `pip install mcp-nixos` resolves to on the oldest and newest supported Pythons.
  test-pip:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package with dev dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -c "import fastmcp; print('fastmcp', fastmcp.__version__)"

    - name: Run tests
      timeout-minutes: 10
      run: pytest tests/ -n auto -m "not integration" --no-cov

  # Verify the release image still builds on both supported Linux architectures.
  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: [build, lint, test]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            system: aarch64-linux
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Build Docker image with Nix
      run: nix build .#packages.${{ matrix.system }}.docker
