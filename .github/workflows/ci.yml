name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.cursorrules'
      - 'RELEASE_NOTES.md'
      - 'RELEASE_WORKFLOW.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - '.github/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.cursorrules'
      - 'RELEASE_NOTES.md'
      - 'RELEASE_WORKFLOW.md'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Check flake
      run: |
        nix flake check
        nix flake show --all-systems --json >/dev/null

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Build Nix package
      run: nix build

    - name: Test package runs
      run: |
        timeout 5s ./result/bin/mcp-nixos --help || true

    - name: Build Python distribution
      run: |
        nix develop --command python -m build
        ls -la dist/

    - name: Validate package metadata
      run: nix develop --command twine check dist/*

  lint:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Lint with ruff
      run: |
        nix develop --command ruff check mcp_nixos/ tests/
        nix develop --command ruff format --check mcp_nixos/ tests/

    - name: Type check with mypy
      run: nix develop --command mypy mcp_nixos/

  test:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Run tests
      timeout-minutes: 10
      run: |
        nix develop --command pytest tests/ -v -n auto --cov=mcp_nixos --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: utensils/mcp-nixos
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Verify the release image still builds on both supported Linux architectures.
  docker-build:
    runs-on: ${{ matrix.runner }}
    needs: [build, lint, test]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            system: aarch64-linux
    steps:
    - uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - name: Build Docker image with Nix
      run: nix build .#packages.${{ matrix.system }}.docker
